<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARCHIVE</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2215%22%20fill%3D%22%23202020%22%2F%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%223.8%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Crect%20x%3D%2215%22%20y%3D%2217%22%20width%3D%2234%22%20height%3D%2210%22%20rx%3D%222%22%2F%3E%3Cpath%20d%3D%22M19%2027v20h26V27M28%2035h8%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e7e7e7; --surface:#ffffff; --surface2:#f1f1f1; --border:#cccccc; --text:#202020; --muted:#707070;
  --accent:#202020; --accent-ink:#ffffff; --accent-soft:#e7e7e7; --danger:#b4443a; --warn:#9a6a14; --warn-soft:#f6ecd4;
  --shadow:0 1px 2px rgba(20,25,22,.05),0 8px 24px rgba(20,25,22,.06);
  --shadow-lg:0 12px 40px rgba(0,0,0,.22);
  --radius:12px; --rail:56px; --sbw:272px;
  /* Supabase использует лицензионный Circular; Figtree — ближайший свободный аналог */
  --ui:"Circular","Circular Std","Figtree","DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:var(--ui);
}
[data-theme="dark"]{color-scheme:dark;--bg:#0f0f0f;--surface:#181818;--surface2:#232323;--border:#343434;--text:#f1f1f1;--muted:#aaaaaa;--accent:#ffffff;--accent-ink:#111111;--accent-soft:#2c2c2c;--danger:#c7c7c7;--warn:#c7c7c7;--warn-soft:#252525;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.4);--shadow-lg:0 12px 40px rgba(0,0,0,.6)}
/* пользовательская расцветка: 4 цвета задаются из JS, остальное выводится */
[data-theme="custom"]{--surface2:color-mix(in srgb,var(--bg),var(--text) 7%);--border:color-mix(in srgb,var(--bg),var(--text) 15%);--muted:color-mix(in srgb,var(--text) 58%,var(--bg));--accent-soft:color-mix(in srgb,var(--surface),var(--accent) 17%);--warn-soft:color-mix(in srgb,var(--surface),#d9a520 18%)}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
::selection{background:var(--accent-soft)}
mark{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 2px;box-shadow:inset 0 -2px 0 var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=date]{color-scheme:inherit}

.app{display:flex;height:100vh;overflow:hidden}

/* ---------- сайдбар в стиле Supabase: узкая рейка, по наведению выезжает поверх контента ---------- */
.sb-shell{width:var(--rail);flex:none;position:relative;z-index:30;transition:width .2s ease}
.app.pinned .sb-shell{width:var(--sbw)}
.sidebar{--cw:var(--rail);--lblw:0px;position:absolute;top:0;bottom:0;left:0;width:var(--rail);background:var(--surface);border-right:1px solid var(--border);overflow:hidden;transition:width .2s ease,box-shadow .2s ease}
.app.pinned .sidebar,.app.branch-menu-open .sidebar,.sidebar:hover,.sidebar:has(:focus-visible){--cw:var(--sbw);--lblw:120px;width:var(--sbw)}
.app:not(.pinned) .sidebar:hover,.app:not(.pinned).branch-menu-open .sidebar,.app:not(.pinned) .sidebar:has(:focus-visible){box-shadow:var(--shadow-lg)}
.sb-inner{width:var(--cw);height:100%;display:flex;flex-direction:column}
.sb-top{padding:12px 10px 6px;display:flex;flex-direction:column;gap:10px}
.brandrow{display:flex;align-items:center;height:36px}
.cell{width:36px;display:grid;place-items:center;flex:none}
.logo-mark{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.logo-text{font-weight:700;letter-spacing:.16em;font-size:14px;margin-left:6px;flex:1;white-space:nowrap;overflow:hidden}
.icon-btn{width:34px;height:34px;border-radius:9px;border:1px solid transparent;background:transparent;color:var(--muted);display:grid;place-items:center;transition:.15s;flex:none}
.icon-btn:hover{background:var(--surface2);color:var(--text)}
.icon-btn:active{transform:scale(.95)}
.icon-btn.on{color:var(--accent)}
.owner{display:flex;align-items:center;height:42px;overflow:hidden}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.owner-t{margin-left:6px;min-width:0;white-space:nowrap}
.owner-t b{display:block;font-size:14px;line-height:1.2;overflow:hidden;text-overflow:ellipsis}
.owner-t small{display:block;color:var(--muted);font-size:12px;line-height:1.2}
.sb-actions{display:flex;flex-direction:column;gap:8px}
.rbtn{display:flex;align-items:center;height:38px;width:100%;border-radius:10px;border:1px solid var(--border);background:var(--surface);padding:0;font-weight:600;font-size:14px;overflow:hidden;white-space:nowrap;transition:.15s}
.rbtn .ic{width:34px;display:grid;place-items:center;flex:none}
.rbtn .t{padding-right:12px}
.rbtn:hover{background:var(--surface2)}
.rbtn:active{transform:translateY(1px)}
.rbtn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rbtn.primary:hover{filter:brightness(1.07);background:var(--accent)}
.sb-search{margin:4px 10px 4px;position:relative;height:36px;width:calc(var(--cw) - 20px)}
.sb-search input{width:100%;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--bg);padding:0 8px 0 34px;outline:none;transition:border-color .15s,background .15s}
.sb-search input:focus{border-color:var(--accent);background:var(--surface)}
.sb-search .i{position:absolute;left:9px;top:9px;color:var(--muted);pointer-events:none}
.sb-label{display:flex;align-items:center;gap:8px;padding:10px 12px 4px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;white-space:nowrap}
.sb-label span{max-width:var(--lblw);overflow:hidden;opacity:calc(var(--lblw) / 120px);transition:max-width .2s,opacity .2s}
.sb-label::after{content:"";flex:1;height:1px;background:var(--border)}
.sb-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 10px 8px}
.nav-item{display:flex;align-items:center;gap:9px;width:100%;height:38px;padding:0 3px;border-radius:10px;border:0;background:transparent;text-align:left;color:var(--text);transition:.15s;position:relative;overflow:hidden;white-space:nowrap}
.nav-item:hover{background:var(--surface2)}
.nav-item.active{background:var(--accent-soft)}
.nav-item.active::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--accent)}
.bico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--surface2);color:var(--muted);flex:none}
.nav-item.active .bico{background:var(--accent);color:var(--accent-ink)}
.nav-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:14.5px}
.nav-meta{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;padding-right:6px;flex:none}
.nav-meta .i{width:15px;height:15px}
.count{font-size:11.5px;background:var(--surface2);padding:1px 7px;border-radius:99px;color:var(--muted)}
.sb-bottom{border-top:1px solid var(--border);padding:8px 10px}
.sb-empty{padding:12px 6px;color:var(--muted);font-size:13px;white-space:normal}
/* Hide the empty-branches message while the compact rail is collapsed. */
@media (min-width:861px){.app:not(.pinned):not(.branch-menu-open) .sidebar:not(:hover):not(:focus-within) .sb-empty{display:none}}
.pin-btn{opacity:calc(var(--lblw) / 120px);transition:opacity .2s}

/* Контекстное меню ветки и ручная сортировка */
.branch-row{position:relative;display:flex;align-items:center;border-radius:10px}
.branch-row>.nav-item{flex:1;min-width:0}
.branch-more{display:none;position:absolute;right:3px;top:3px;width:30px;height:32px;border:0;border-radius:8px;color:var(--muted);background:var(--surface);align-items:center;justify-content:center}
.branch-more .i{width:16px;height:16px}
.branch-row:hover .branch-more,.branch-row:focus-within .branch-more{display:flex}
.branch-row:hover .nav-meta{margin-right:28px}
.branch-row.dragging{opacity:.45}
.branch-row.drag-over{box-shadow:inset 0 2px var(--accent)}
.branch-context{position:fixed;z-index:210;width:242px;padding:6px;border-radius:12px;border:1px solid var(--border);box-shadow:var(--shadow-lg);background:var(--surface);color:var(--text)}
.branch-context .context-label{padding:6px 10px;font-size:12px;font-weight:700;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.branch-context button{width:100%;display:flex;align-items:center;gap:10px;padding:9px 10px;background:transparent;border:0;border-radius:8px;text-align:left;font-size:13px}
.branch-context button:hover{background:var(--surface2)}
.branch-context button:disabled{opacity:.35;cursor:default}
.branch-context button .i{width:16px;height:16px}
.branch-context button.danger{color:var(--danger)}
.branch-context hr{margin:5px 0;border:0;border-top:1px solid var(--border)}
/* ---------- main ---------- */
.main-col{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 20px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);position:relative;z-index:20}
.menu-btn{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface);font-weight:600;font-size:14px;transition:.15s;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07);background:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.sm{height:32px;padding:0 11px;font-size:13px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface2)}
.search{position:relative;flex:1;max-width:620px}
.search input{width:100%;height:40px;border-radius:11px;border:1px solid var(--border);background:var(--surface);padding:0 12px 0 38px;outline:none;transition:.15s}
.search.has-scope input{padding-right:170px}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search>.i{position:absolute;left:12px;top:11px;color:var(--muted)}
.scope{position:absolute;right:5px;top:5px;display:flex;background:var(--surface2);border-radius:8px;padding:2px}
.scope button{border:0;background:transparent;height:26px;padding:0 10px;border-radius:6px;font-size:12px;font-weight:600;color:var(--muted);transition:.15s}
.scope button:hover{color:var(--text)}
.scope button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.spacer{flex:1}
.seg{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;height:30px;padding:0 11px;border-radius:8px;color:var(--muted);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.popwrap{position:relative}
.pop{position:absolute;right:0;top:calc(100% + 8px);min-width:230px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;display:none;z-index:50}
.popwrap.open>.pop{display:block;animation:pop .14s ease}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}}
.pop>button,.pop .prow>button.main{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:8px 10px;border-radius:8px;text-align:left;font-size:14px}
.pop>button:hover,.pop .prow:hover{background:var(--surface2)}
.pop>button.danger{color:var(--danger)}
.pop hr{border:0;border-top:1px solid var(--border);margin:5px 0}
.pop .ph{padding:6px 10px 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.pop .pf{padding:6px 10px 4px;font-size:12px;color:var(--muted);line-height:1.4}
.pop small{margin-left:auto;color:var(--muted);font-size:12px}
.prow{display:flex;align-items:center;border-radius:8px}
.prow>button.main{flex:1}
.prow .icon-btn{width:28px;height:28px}
.sw{width:18px;height:18px;border-radius:50%;border:1px solid var(--border);flex:none;position:relative;overflow:hidden}
.sw::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,transparent 50%,var(--c2) 50%)}
.sw.on{outline:2px solid var(--accent);outline-offset:1px}
.pop .avatar{width:24px;height:24px;font-size:11px}
.pop button.sel .avatar{background:var(--accent);color:var(--accent-ink)}

#main{flex:1;overflow:auto;scroll-behavior:smooth}
.wrap{max-width:820px;margin:0 auto;padding:28px 24px 80px}
.wrap.wide{max-width:900px}

.bhead{margin-bottom:22px}
.bhead-top{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.bhead h1{font-size:30px;line-height:1.15;margin:0;letter-spacing:-.02em;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:99px;font-size:12.5px;font-weight:600;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip .i{width:14px;height:14px}
.chip.public{background:var(--accent-soft);color:var(--accent)}
.chip.private{background:var(--warn-soft);color:var(--warn)}
.chip.link{background:var(--surface2);color:var(--text)}
.bhead-sub{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px}
.vis-note{margin-top:12px;font-size:13.5px;color:var(--muted);background:var(--surface);border:1px dashed var(--border);border-radius:10px;padding:10px 14px;display:flex;gap:10px;align-items:flex-start}
.vis-note .i{margin-top:2px;color:var(--accent)}
.vis-note.priv .i{color:var(--warn)}
.found{font-size:13px;color:var(--muted);margin:0 0 14px}

.post{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);margin-bottom:24px;overflow:hidden;transition:border-color .2s}
.post.flash{animation:flash 1.8s ease}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:var(--shadow)}}
.post-head{padding:24px 28px 6px}
.post-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.post-meta .dot{width:3px;height:3px;border-radius:50%;background:var(--muted);opacity:.6}
.post h2{font-size:28px;line-height:1.2;letter-spacing:-.015em;margin:8px 0 0;font-weight:700}
.pin{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-weight:600}
.pin .i{width:14px;height:14px}
.post-body{padding:8px 28px 12px}
.b-text p{font-size:17px;line-height:1.7;margin:.9em 0}
.b-text p:first-child{margin-top:.5em}
.b-imgs{margin:20px 0;display:flex;flex-direction:column;gap:10px}
.b-row{display:flex;gap:10px;align-items:flex-start;justify-content:center}
.fig{margin:0;min-width:0}
.fig .ph{border-radius:10px;overflow:hidden;background:var(--surface2);cursor:zoom-in;display:block;position:relative}
.fig img{display:block;width:100%;height:auto;transition:transform .3s}
.fig .ph:hover img{transform:scale(1.015)}
.fig figcaption{font-size:13.5px;color:var(--muted);padding:7px 2px 0;line-height:1.4}
.post-actions{display:flex;align-items:center;gap:4px;padding:10px 18px;border-top:1px solid var(--border);flex-wrap:wrap}
.act{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 11px;border-radius:9px;border:0;background:transparent;color:var(--muted);font-size:13.5px;font-weight:600;transition:.15s}
.act:hover{background:var(--surface2);color:var(--text)}
.act.on{color:var(--accent)}
.act:active{transform:scale(.97)}
.menu-wrap{position:relative;margin-left:auto}
.menu-wrap>.pop{top:auto;bottom:calc(100% + 6px);right:0}

.comments{border-top:1px solid var(--border);background:var(--surface2);padding:18px 28px 20px;display:none}
.comments.open{display:block}
.comments h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 14px;font-weight:700}
.cm{display:flex;gap:12px;margin-bottom:16px}
.cm .avatar{width:34px;height:34px}
.cm .avatar.anon{background:var(--surface);color:var(--muted);border:1px dashed var(--border)}
.cm-body{flex:1;min-width:0}
.cm-head{display:flex;align-items:baseline;gap:8px;font-size:13px;color:var(--muted)}
.cm-head b{color:var(--text);font-size:14px}
.tag{font-size:11px;padding:0 6px;border-radius:5px;background:var(--surface);border:1px solid var(--border);color:var(--muted);font-weight:600}
.cm-text{font-size:14.5px;margin-top:2px;white-space:pre-wrap;word-wrap:break-word}
.cm-del{margin-left:auto;border:0;background:transparent;color:var(--muted);opacity:0;transition:.15s;font-size:12.5px;padding:0 4px}
.cm:hover .cm-del{opacity:1}
.cm-del:hover{color:var(--danger)}
.cm-form{display:flex;gap:12px;align-items:flex-start;margin-top:6px}
.cm-form textarea,.cm-form input.nm{width:100%;border-radius:10px;border:1px solid var(--border);background:var(--surface);padding:10px 12px;outline:none}
.cm-form textarea{min-height:42px;resize:vertical;max-height:200px}
.cm-form input.nm{height:36px;padding:0 12px;margin-bottom:8px;max-width:260px}
.cm-form textarea:focus,.cm-form input.nm:focus{border-color:var(--accent)}
.cm-hint{font-size:12px;color:var(--muted)}
.cm-off{font-size:13.5px;color:var(--muted)}

.empty{text-align:center;padding:70px 20px;color:var(--muted)}
.empty .big{width:56px;height:56px;border-radius:16px;background:var(--surface2);display:grid;place-items:center;margin:0 auto 16px;color:var(--muted)}
.empty .big .i{width:26px;height:26px}
.empty h3{margin:0 0 6px;color:var(--text);font-size:18px}
.empty p{margin:0 auto 18px;max-width:400px;font-size:14.5px}
.lock{max-width:480px;margin:60px auto;text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:40px 30px;box-shadow:var(--shadow)}
.lock .big{width:60px;height:60px;border-radius:18px;background:var(--warn-soft);color:var(--warn);display:grid;place-items:center;margin:0 auto 16px}
.lock .big .i{width:28px;height:28px}
.lock h2{margin:0 0 8px;letter-spacing:-.01em}
.lock p{color:var(--muted);margin:0 0 20px}

.list-card{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.list-card .lc-main{flex:1;min-width:0}
.list-card h4{margin:0;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-card p{margin:2px 0 0;color:var(--muted);font-size:13px}
.page-title{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.page-title h1{margin:0;font-size:28px;letter-spacing:-.02em}
.page-sub{color:var(--muted);margin:0 0 22px;font-size:14px}

/* глобальный поиск */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.filters .field{height:34px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}

<script>
(function(){

/* ================= helpers ================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
// Точный поиск в ветке: отдельные слова, а не фрагменты других слов.
// Для общего поиска сохраняется привычный поиск по подстроке.
const wordParts=q=>String(q||'').trim().split(/\s+/u).filter(Boolean);
const wholeWord=word=>new RegExp('(^|[^\\p{L}\\p{N}_])('+reEsc(word)+')(?=$|[^\\p{L}\\p{N}_])','iu');
// Search synonyms: all supported spellings of pit lane are one search term.
// Whitespace / dash are folded before exact-word matching, not globally stripped.
const termNormalize=s=>String(s||'').toLocaleLowerCase().replace(/\bpit[\s-]*lane\b/giu,' pitlane ').replace(/пит[\s-]*лейн/giu,' питlane ').replace(/питlane/giu,' pitlane ');
const searchWords=q=>wordParts(termNormalize(q));

function hl(text,q){
  text=String(text??'');
  if(!q) return esc(text);

function matchPost(p,q){
  if(!q) return true;
  if(ui.view==='branch'){
    const searchable=termNormalize([p.title||'',...p.blocks.flatMap(b=>b.type==='text'?[b.text]:b.items.map(i=>i.caption||'')),...p.comments.flatMap(c=>[c.text,c.name])].join(' '));
    return searchWords(q).every(w=>wholeWord(w).test(searchable));
  }
  q=q.toLowerCase();
  if((p.title||'').toLowerCase().includes(q)) return true;
  for(const b of p.blocks){
    if(b.type==='text'&&b.text.toLowerCase().includes(q)) return true;
    if(b.type==='images'&&b.items.some(i=>(i.caption||'').toLowerCase().includes(q))) return true;
  }
  return p.comments.some(c=>c.text.toLowerCase().includes(q)||c.name.toLowerCase().includes(q));
}
function orderSnapshot(){
  const list=postsOf(curBranch().id).slice().sort((a,b)=>
    (Number(b.pinned)-Number(a.pinned))||((a.sortOrder??Number.MAX_SAFE_INTEGER)-(b.sortOrder??Number.MAX_SAFE_INTEGER))||(b.created-a.created));
  return list.map(p=>({id:p.id,sortOrder:p.sortOrder,pinned:!!p.pinned}));
}
function showPostOrder(){
  if(!isStaff()||!curBranch())return;

}

    </div>`;

function movePostOrder(from,to){
  if(!ui.sortDraft||from<0||to<0||from>=ui.sortDraft.length||to>=ui.sortDraft.length||from===to)return;
  ui.sortDraft.splice(to,0,ui.sortDraft.splice(from,1)[0]);renderOrderList();
}
function renderFeed(){
  const el=$('#feed'); if(!el) return;
  const b=curBranch(); if(!b) return;
  const q=ui.q.trim();
  let list=postsOf(b.id).filter(p=>matchPost(p,q)).sort((a,c)=>(Number(c.pinned)-Number(a.pinned))||((a.sortOrder??Number.MAX_SAFE_INTEGER)-(c.sortOrder??Number.MAX_SAFE_INTEGER))||(c.created-a.created));
  if(!list.length){
    if(q){el.innerHTML=`<div class="empty"><div class="big">${I('search')}</div><h3>Ничего не найдено</h3><p>В ветке «${esc(b.name)}» нет постов с указанными словами: «${esc(q)}».</p><button class="btn" data-a="setScope" data-s="global">${I('search')}Искать по всему архиву</button></div>`}
    else if(!canCreate()){el.innerHTML=`<div class="empty"><div class="big">${I('archive')}</div><h3>Здесь пока пусто</h3><p>В этой ветке ещё ничего не опубликовано.</p></div>`}
    else {el.innerHTML=`<div class="empty"><div class="big">${I('archive')}</div><h3>Ветка пока пуста</h3><p>Первый пост может состоять из любых блоков: текст, фото, снова текст.</p><button class="btn primary" data-a="newPost">${I('plus')}Создать пост</button></div>`}
    return;
  }
  el.innerHTML=(q?`<p class="found">Найдено: ${list.length} ${plural(list.length,'пост','поста','постов')} в этой ветке</p>`:'')+list.map(p=>postHTML(p,b,q)).join('');
}
function textHTML(t,q){return t.split(/\n{2,}/).map(par=>`<p>${hl(par,q).replace(/\n/g,'<br>')}</p>`).join('')}
function imagesHTML(items,q){
  const n=items.length;
  let chunks=[];
  if(n<=3)chunks=[items];
  else if(n===4)chunks=[items.slice(0,2),items.slice(2)];
  else for(let i=0;i<n;i+=3)chunks.push(items.slice(i,i+3));
  return `<div class="b-imgs">`+chunks.map(ch=>{
    if(ch.length===1){
      const it=ch[0],r=it.w/it.h;
      const w=r<1?`min(100%,${Math.round(640*r)}px)`:'100%';
      return `<div class="b-row"><figure class="fig" style="width:${w}">${figHTML(it,q)}</figure></div>`;
    }
    return `<div class="b-row">`+ch.map(it=>`<figure class="fig" style="flex:${(it.w/it.h).toFixed(3)} 1 0">${figHTML(it,q)}</figure>`).join('')+`</div>`;
  }).join('')+`</div>`;
}
function figHTML(it,q){
  return `<span class="ph" data-a="zoom"><img src="${esc(it.src)}" width="${it.w}" height="${it.h}" alt="${esc(it.caption||'Фотография')}" loading="lazy"></span>${it.caption?`<figcaption>${hl(it.caption,q)}</figcaption>`:''}`;
}
function postHTML(p,b,q){
  const staff=isStaff(), mgr=canManagePost(p);
  const open=ui.openComments.has(p.id);
  const cn=p.comments.length;
  const edited=p.updated-p.created>6e4;
  const body=p.blocks.map(bl=>bl.type==='text'?`<div class="b-text">${textHTML(bl.text,q)}</div>`:imagesHTML(bl.items,q)).join('');
  const by=p.by&&p.by!=='owner'?`<span class="dot"></span><span>${esc(userName(p.by))}</span>`:'';
  const hist=staff&&p.history&&p.history.length;
  return `<article class="post" id="post-${p.id}">
    <div class="post-head">
      <div class="post-meta">
        ${p.pinned?`<span class="pin">${I('pin')}Закреплён</span><span class="dot"></span>`:''}
        <span title="Дата и время публикации">${fmtPublished(p.created)}</span>${by}${edited?`<span class="dot"></span><span title="${new Date(p.updated).toLocaleString('ru-RU')}">изменён ${rel(p.updated)}</span>`:''}
        <span class="dot"></span><span class="chip ${b.vis}" title="Видимость публикации">${I(VIS[b.vis].icon)}${b.vis==='private'?'Приватный':b.vis==='link'?'По ссылке':'Публичный'}</span>
      </div>
      <h2>${hl(p.title||'Без названия',q)}</h2>
    </div>
    <div class="post-body">${body}</div>
    <div class="post-actions">
      ${b.comments?`<button class="act ${open?'on':''}" data-a="toggleComments" data-id="${p.id}">${I('msg')}Комментарии${cn?` · ${cn}`:''}</button>`:''}
      ${b.vis!=='private'?`<button class="act" data-a="copy" data-b="${b.id}" data-p="${p.id}">${I('link')}Ссылка</button>`:''}
      ${hist?`<button class="act" data-a="history" data-id="${p.id}" title="Видно только админам">${I('history')}История правок · ${p.history.length+1}</button>`:''}
      ${staff?`<button class="act ${p.pinned?'on':''}" data-a="pin" data-id="${p.id}">${I('pin')}${p.pinned?'Открепить':'Закрепить'}</button>`:''}
      ${mgr?`<button class="act" data-a="editPost" data-id="${p.id}">${I('edit')}Редактировать</button>`:''}
      ${mgr||staff?`<div class="menu-wrap popwrap">
        <button class="act" data-a="togglePop2" aria-label="Ещё">${I('more')}</button>
        <div class="pop">
          ${staff?`<button data-a="pin" data-id="${p.id}">${I('pin')}${p.pinned?'Открепить':'Закрепить'}</button>`:''}
          ${staff&&b.vis!=='private'?`<button data-a="openAnon" data-b="${b.id}" data-p="${p.id}">${I('ext')}Открыть как аноним</button>`:''}
          ${mgr?`<button data-a="toDraft" data-id="${p.id}">${I('file')}Вернуть в черновики</button><hr><button class="danger" data-a="toTrash" data-id="${p.id}">${I('trash')}В корзину</button>`:''}
        </div>
      </div>`:''}
    </div>
    ${b.comments?commentsHTML(p,b,open,q):''}
  </article>`;
}
function commentsHTML(p,b,open,q){
  const u=me();
  const canDel=c=>isStaff()||(u&&c.uid===u.id);
  const form=u
   ?`<div class="cm-form"><div class="avatar">${esc(u.name.charAt(0).toUpperCase())}</div><div style="flex:1"><textarea rows="1" placeholder="Написать комментарий как «${esc(u.name)}»…" data-cmin="${p.id}" aria-label="Новый комментарий"></textarea><div style="display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap"><button class="btn sm primary" data-a="addComment" data-id="${p.id}">Отправить</button><span class="cm-hint">Ctrl+Enter — отправить</span></div></div></div>`
   :b.anon
   ?`<div class="cm-form"><div class="avatar anon">?</div><div style="flex:1"><input class="nm" data-cmname="${p.id}" placeholder="Имя (необязательно)" maxlength="30" aria-label="Имя"><textarea rows="1" placeholder="Анонимный комментарий…" data-cmin="${p.id}" aria-label="Новый комментарий"></textarea><div style="display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap"><button class="btn sm primary" data-a="addComment" data-id="${p.id}">Отправить</button><span class="cm-hint">Вы комментируете как аноним. Ctrl+Enter — отправить</span></div></div></div>`
   :`<p class="cm-off">Анонимные комментарии в этой ветке отключены. Нужна учётная запись.</p>`;
  return `<section class="comments ${open?'open':''}" id="cm-${p.id}" aria-label="Комментарии">
    <h3>Комментарии${p.comments.length?` · ${p.comments.length}`:''}</h3>
    ${p.comments.length?p.comments.map(c=>`<div class="cm"><div class="avatar ${c.anon?'anon':''}">${esc(c.name.charAt(0).toUpperCase())}</div><div class="cm-body"><div class="cm-head"><b>${hl(c.name,q)}</b>${c.anon?'<span class="tag">аноним</span>':''}<span title="${new Date(c.time).toLocaleString('ru-RU')}">${rel(c.time)}</span>${canDel(c)?`<button class="cm-del" data-a="delComment" data-p="${p.id}" data-id="${c.id}">Удалить</button>`:''}</div><div class="cm-text">${hl(c.text,q)}</div></div></div>`).join(''):'<p class="cm-off" style="margin:0 0 14px">Пока нет комментариев.</p>'}

  </section>`;
}

/* ---------- черновики / корзина ---------- */
function renderListView(m,kind){
  const isD=kind==='drafts';

/* ---------- глобальный поиск ---------- */
function snippetFor(p,q){
  const parts=[];p.blocks.forEach(b=>{if(b.type==='text')parts.push(b.text);else b.items.forEach(i=>i.caption&&parts.push(i.caption))});
  const all=parts.join(' · ').replace(/\s+/g,' ');
  const dflt=esc(all.slice(0,170))+(all.length>170?'…':'');
  if(!q)return dflt;
  const low=q.toLowerCase();
  const idx=all.toLowerCase().indexOf(low);
  if(idx<0){
    const cm=p.comments.find(c=>c.text.toLowerCase().includes(low)||c.name.toLowerCase().includes(low));
    if(cm)return '<span class="tag">комментарий</span> '+hl(cm.text.slice(0,150),q);
    return dflt;
  }
  const s=Math.max(0,idx-60),e=Math.min(all.length,idx+q.length+110);
  return (s>0?'…':'')+hl(all.slice(s,e),q)+(e<all.length?'…':'');
}
function searchPosts(){
  const q=ui.q.trim();
  const f=ui.gf;
  const from=f.from?new Date(f.from+'T00:00:00').getTime():null;
  const to=f.to?new Date(f.to+'T23:59:59.999').getTime():null;
  return data.posts.filter(p=>{
    if(p.status!=='published')return false;
    const b=branchById(p.branch);
    if(!b)return false;
    if(!(isStaff()||b.vis==='public'))return false; // link и private в поиск не попадают
    if(f.branch&&p.branch!==f.branch)return false;
    if(from&&p.created<from)return false;
    if(to&&p.created>to)return false;
    if(f.photos&&!p.blocks.some(x=>x.type==='images'&&x.items.length))return false;
    return matchPost(p,q);
  }).sort((a,b)=>b.created-a.created);
}

function addImages(items){
  const e=ui.editor;if(!e||!items.length)return;

  if(!blk){

    if(last&&last.type==='text'&&!last.text.trim()&&e.blocks.length===1) e.blocks.unshift(blk); else e.blocks.push(blk);
  }

function fileToItem(file){
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=()=>{
      const im=new Image();
      im.onload=()=>{
        let w=im.naturalWidth||4,h=im.naturalHeight||3,src=r.result,resized=false;
        if(!/gif|svg/.test(file.type)){
          const s=Math.min(1,MAXPX/Math.min(w,h));
          const nw=Math.round(w*s),nh=Math.round(h*s);
          try{
            const cv=document.createElement('canvas');cv.width=nw;cv.height=nh;
            const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,nw,nh);cx.drawImage(im,0,0,nw,nh);
            src=cv.toDataURL('image/jpeg',.86);w=nw;h=nh;resized=s<1;
          }catch(_){}
        }
        res({src,w,h,caption:'',_resized:resized});
      };
      im.onerror=()=>res(null);im.src=r.result;
    };
    r.onerror=()=>res(null);r.readAsDataURL(file);
  });
}
async function handleFiles(files){
  const arr=[...files].filter(f=>f.type.startsWith('image/'));
  if(!arr.length){toast('Это не изображение');return}
  const items=(await Promise.all(arr.map(fileToItem))).filter(Boolean);
  const shrunk=items.some(i=>i._resized);
  items.forEach(i=>delete i._resized);
  addImages(items);
  if(items.length)toast(shrunk?`Фото уменьшено до ${MAXPX} px по короткой стороне`:(items.length===1?'Фото добавлено':`Добавлено фото: ${items.length}`));
}
const sig=p=>JSON.stringify([p.title,p.blocks.filter(b=>b.type==='text').map(b=>b.text),p.blocks.reduce((n,b)=>n+(b.type==='images'?b.items.length:0),0),p.blocks.flatMap(b=>b.type==='images'?b.items.map(i=>i.caption||''):[])]);
function snap(p){
  return {ts:p.updated,by:p.lastBy||p.by,title:p.title,texts:p.blocks.filter(b=>b.type==='text').map(b=>b.text),photos:p.blocks.reduce((n,b)=>n+(b.type==='images'?b.items.length:0),0),caps:p.blocks.flatMap(b=>b.type==='images'?b.items.map(i=>i.caption||''):[])};
}
function commitEditor(status){
  const e=ui.editor;
  e.blocks=e.blocks.filter(b=>b.type==='images'?b.items.length:b.text.trim());
  const hasContent=e.blocks.length||e.title.trim();
  if(!hasContent){toast('Пост пустой: добавьте заголовок, текст или фото');if(!e.blocks.length)e.blocks.push({id:uid(),type:'text',text:''});reBlocks();return false}
  if(status==='published'&&!e.title.trim()){toast('Для публикации нужен заголовок');$('#e-title').focus();return false}
  if(status==='published'&&!branchById(e.branch)){
    toast('Ветка не выбрана или удалена — сначала выберите действующую ветку');
    $('#e-branch')?.focus();
    return false;
  }
  const now=Date.now();
  let p=e.id&&data.posts.find(x=>x.id===e.id);
  if(p){
    const before=snap(p),sigBefore=sig(p),wasPub=p.status==='published';
    p.title=e.title.trim();p.blocks=e.blocks;p.branch=e.branch;
    if(wasPub&&status==='published'){
      if(sig(p)!==sigBefore){p.history=p.history||[];p.history.push(before);p.updated=now;p.lastBy=ui.as}
    }else{
      p.updated=now;p.lastBy=ui.as;
      if(status==='published'){p.created=now}
      p.status=status;
    }
  }else{
    p={id:'p'+uid(),branch:e.branch,status,pinned:false,by:ui.as,lastBy:ui.as,created:now,updated:now,title:e.title.trim(),blocks:e.blocks,comments:[],history:[]};
    data.posts.push(p);
  }
  save();
  return p;
}

/* ---------- история правок ---------- */
function diffSummary(a,b){
  const parts=[];
  if(a.title!==b.title)parts.push('заголовок');
  let ch=0;const n=Math.max(a.texts.length,b.texts.length);
  for(let i=0;i<n;i++)if(a.texts[i]!==b.texts[i])ch++;
  if(ch)parts.push('текст'+(ch>1?` (${ch} ${plural(ch,'блок','блока','блоков')})`:''));
  const d=b.photos-a.photos;
  if(d>0)parts.push(`+${d} фото`);else if(d<0)parts.push(`−${-d} фото`);
  else if(JSON.stringify(a.caps)!==JSON.stringify(b.caps))parts.push('подписи к фото');

function zoom(items,index){

function drawGallery(){
  const d=$('.lightbox');if(!d||!gallery)return;
  const {items,index}=gallery, it=items[index];
  gallery.scale=1;gallery.x=0;gallery.y=0;
  $('.lightbox-stage img',d).style.transform='';
  $('.lightbox-stage img',d).src=it.src;
  $('.lightbox-stage img',d).alt=it.caption||'Фотография';
  $('.lightbox-caption',d).textContent=it.caption||'';
  $('.lightbox-count',d).textContent=items.length>2?`${index+1} / ${items.length}`:'';
  $('.lightbox-count',d).style.display=items.length>2?'block':'none';
  $('.lightbox-prev',d).style.display=items.length>1?'block':'none';
  $('.lightbox-next',d).style.display=items.length>1?'block':'none';
}
function setGalleryScale(scale){
  if(!gallery)return;
  gallery.scale=Math.max(1,Math.min(6,scale));
  if(gallery.scale===1){gallery.x=0;gallery.y=0}
  const img=$('.lightbox-stage img');if(!img)return;
  img.style.transform=`translate(${gallery.x}px,${gallery.y}px) scale(${gallery.scale})`;
  img.style.cursor=gallery.scale>1?(galleryDrag?'grabbing':'grab'):'zoom-in';
}
function stepGallery(dir){if(!gallery)return;gallery.index=(gallery.index+dir+gallery.items.length)%gallery.items.length;drawGallery()}

 const o=nbObject(id),el=$(`[data-obj="${id}"]`);if(!o||o.type!=='text'||!el)return;
 const content=el.querySelector('.nb-text-content'),head=el.querySelector('.nb-move');if(!content)return;

 // Measure actual text without counting the manually stretched blank writing area.

 const desired=Math.max(65,nbNum(o.minH,65),Math.ceil((head?.offsetHeight||25)+textHeight+4));

// Erase only the intersecting parts of hand-drawn lines, leaving their other segments intact.
function nbEraseAt(e){
 const n=noteCurrent();if(!n?.board)return;
 const pt=nbWorldPoint(e),radius=12/n.board.camera.z;
 let changed=false;
 const result=[];
 for(const path of n.board.paths){
   const points=path.pts||[];if(!points.length)continue;
   const fragments=[];let segment=[];let cut=false;
   const flush=()=>{if(segment.length>=2)fragments.push({...path,pts:segment});segment=[]};
   const sampled=[];
   if(points.length===1)sampled.push(points[0]);
   for(let i=0;i<points.length-1;i++){
     const a=points[i],b=points[i+1],dist=Math.hypot(b[0]-a[0],b[1]-a[1]);
     const steps=Math.max(1,Math.min(300,Math.ceil(dist/Math.max(2,radius/3))));
     for(let j=0;j<steps;j++){const t=j/steps;sampled.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t])}
   }
   if(points.length>1)sampled.push(points[points.length-1]);
   if(!sampled.some(p=>Math.hypot(p[0]-pt.x,p[1]-pt.y)<radius+Math.max(1,path.width||3)/2)){result.push(path);continue}
   changed=true;
   for(const p of sampled){
     if(Math.hypot(p[0]-pt.x,p[1]-pt.y)<radius+Math.max(1,path.width||3)/2){cut=true;flush()}
     else segment.push(p);
   }
   flush();
   result.push(...fragments);
 }
 if(changed){n.board.paths=result;const ink=$('#nb-ink');if(ink)ink.innerHTML=result.map(nbPathHTML).join('');nbQueueSave()}
}

function noteRenameInline(tab){
 const n=data.notebook.find(p=>p.id===tab.dataset.noteTab);
 if(!n||tab.querySelector('input.note-tab-edit'))return;
 const label=tab.querySelector('span');if(!label)return;
 const old=n.title;
 const field=document.createElement('input');field.type='text';field.className='note-tab-edit';field.value=old;field.maxLength=70;field.setAttribute('aria-label',ui.lang==='en'?'Rename canvas':'Название страницы');
 label.replaceWith(field);field.focus();field.select();
 let done=false;
 const finish=(commit)=>{
   if(done)return;done=true;
   if(commit&&field.value.trim()){n.title=field.value.trim().slice(0,70);noteSaveNow()}
   const span=document.createElement('span');span.textContent=n.title;field.replaceWith(span);
 };
 field.addEventListener('click',e=>e.stopPropagation());
 field.addEventListener('dblclick',e=>e.stopPropagation());
 field.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();finish(true)}else if(e.key==='Escape'){e.preventDefault();finish(false)}e.stopPropagation()});
 field.addEventListener('blur',()=>finish(true));
}

  galleryDrag={id:e.pointerId,px:e.clientX,py:e.clientY,startX:e.clientX,startY:e.clientY,moved:false};
  setGalleryScale(gallery.scale);
});
function finishGalleryDrag(){
  if(galleryDrag?.moved)galleryDraggedAt=Date.now();
  galleryDrag=null;
  if(gallery)setGalleryScale(gallery.scale);
}
document.addEventListener('pointermove',e=>{
  if(!galleryDrag||!gallery||e.pointerId!==galleryDrag.id)return;
  if(!(e.buttons&1)){finishGalleryDrag();return}
  const dx=e.clientX-galleryDrag.px,dy=e.clientY-galleryDrag.py;
  if(dx||dy){
    gallery.x+=dx;gallery.y+=dy;
    galleryDrag.px=e.clientX;galleryDrag.py=e.clientY;
    galleryDrag.moved=galleryDrag.moved||Math.hypot(e.clientX-galleryDrag.startX,e.clientY-galleryDrag.startY)>5;
    setGalleryScale(gallery.scale);
  }
});
document.addEventListener('pointerup',e=>{
  if(galleryDrag&&e.pointerId===galleryDrag.id)finishGalleryDrag();
});
document.addEventListener('pointercancel',e=>{
  if(galleryDrag&&e.pointerId===galleryDrag.id)finishGalleryDrag();
});
window.addEventListener('blur',()=>{if(galleryDrag)finishGalleryDrag()});

function enText(s){
 const t=s.trim();if(!t)return s;
 let v=EN[t];
 if(v===undefined){
   if(/^публичный \(от ветки\)$/i.test(t))v='public (inherited)';
   else if(/^приватный \(от ветки\)$/i.test(t))v='private (inherited)';
   else if(/^по ссылке \(от ветки\)$/i.test(t))v='unlisted (inherited)';
   else if(/^Комментар(?:ии|ий) · (\d+)$/i.test(t))v=t.replace(/^Комментар(?:ии|ий)/i,'Comments');
   else if(/^История правок · (\d+)$/i.test(t))v=t.replace('История правок','Edit history');
   else if(/^изменён /i.test(t))v=t.replace(/^изменён /i,'edited ');
   else if(/^\d+ пост(?:ов|а)?$/i.test(t))v=t.replace(/пост(?:ов|а)?/i,'posts');
   else if(/^Найдено: \d+ пост(?:ов|а)? в этой ветке/.test(t))v=t.replace('Найдено:','Found:').replace(/пост(?:ов|а)? в этой ветке/,'posts in this branch');
 }
 return v===undefined?s:s.replace(t,v);
}
const avoidTranslate='script,style,.notes-paper,.notes-tabs,.notes-tools,.post-body,.post h2,.bhead h1,.cm-text,.cm-head b,.figcaption,.order-item-title,.nav-item[data-a="openBranch"] .nav-name,.owner-t b,.owner .avatar,.res h4,.res p,.list-card h4,.list-card p,.ver .vtext,.ed-title,.eb textarea,.thumb input';
function translateUI(){
 if(ui.lang!=='en')return;
 const root=document.body;
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
 const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
 for(const node of nodes){const parent=node.parentElement;if(!parent||parent.closest(avoidTranslate))continue;
   const after=enText(node.nodeValue);if(after!==node.nodeValue)node.nodeValue=after;
 }
 for(const el of root.querySelectorAll('[placeholder],[title],[aria-label]')){
   if(el.closest(avoidTranslate))continue;
   for(const att of ['placeholder','title','aria-label']){if(el.hasAttribute(att)){const v=el.getAttribute(att),n=enText(v);if(n!==v)el.setAttribute(att,n)}}
 }
 // Dynamic search placeholder, while preserving selected branch title.
 for(const inp of root.querySelectorAll('#qsearch')){
   const p=inp.placeholder;
   if(p.startsWith('Искать в ветке'))inp.placeholder=p.replace('Искать в ветке','Search in branch');
   else if(p.startsWith('Искать по всему архиву'))inp.placeholder='Search posts, captions and comments across the archive…';
   else if(p.startsWith('Искать в черновиках'))inp.placeholder='Search drafts…';
   else if(p.startsWith('Искать в корзине'))inp.placeholder='Search trash…';
 }
}
// Translate freshly rendered UI without touching the user's written content.
let translationPending=false;
const translationObserver=new MutationObserver(()=>{
 if(ui.lang!=='en'||translationPending)return;
 translationPending=true;
 queueMicrotask(()=>{translationObserver.disconnect();try{translateUI()}finally{translationPending=false;translationObserver.observe(document.body,{subtree:true,childList:true})}});
});
translationObserver.observe(document.body,{subtree:true,childList:true});

document.addEventListener('contextmenu',e=>{
  if(ui.view==='notebook'&&e.target.closest('#nb-viewport'))return;
  const item=e.target.closest('[data-branch-row]');
  const head=e.target.closest('[data-branch-head]');
  const id=item?.dataset.branchRow||head?.dataset.branchHead;
  if(id&&isStaff()){e.preventDefault();branchMenu(id,e.clientX,e.clientY)}
},true);
document.addEventListener('click',e=>{
  const option=e.target.closest('#branch-context [data-cb]');
  if(option){e.preventDefault();branchContextAction(branchContextId,option.dataset.cb);return}
  if(!e.target.closest('#branch-context')&&!e.target.closest('[data-a="branchMenu"]'))closeBranchContext();
},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeBranchContext()});
let movingBranchId=null;
document.addEventListener('dragstart',e=>{
  const item=e.target.closest('[data-branch-row]');
  if(!item||!isStaff()||ui.bq.trim())return;
  movingBranchId=item.dataset.branchRow;item.classList.add('dragging');
  e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',movingBranchId);
});
document.addEventListener('dragover',e=>{
  if(!movingBranchId)return;
  const item=e.target.closest('[data-branch-row]');if(!item)return;
  e.preventDefault();e.dataTransfer.dropEffect='move';
  $$('.branch-row.drag-over').forEach(x=>x.classList.remove('drag-over'));
  item.classList.add('drag-over');
});
document.addEventListener('drop',e=>{
  if(!movingBranchId)return;
  const item=e.target.closest('[data-branch-row]');if(!item)return;
  e.preventDefault();const from=data.branches.findIndex(b=>b.id===movingBranchId),to=data.branches.findIndex(b=>b.id===item.dataset.branchRow);
  movingBranchId=null;branchReorder(from,to);
});
document.addEventListener('dragend',()=>{movingBranchId=null;$$('.branch-row.drag-over,.branch-row.dragging').forEach(x=>x.classList.remove('drag-over','dragging'))});
/* ================= старт ================= */
translateUI();
if(!applyRoute())renderAll();
})();
